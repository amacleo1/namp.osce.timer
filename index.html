<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OSCE Timer (NAMP)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body{
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#111;
      color:#fff;
      margin:0;
      padding:2rem;
    }

    h1{
      text-align:center;
      margin-bottom:1rem;
    }

    .settings,.controls{
      max-width:640px;
      margin:0 auto 2rem;
      background:#1e1e1e;
      padding:1.5rem;
      border-radius:12px;
    }

    label{
      display:block;
      margin-top:1rem;
    }

    .row{
      display:flex;
      gap:.5rem;
      align-items:center;
      margin-top:.5rem;
      justify-content:center;
      flex-wrap:wrap;
    }

    input[type="number"]{
      width:100%;
      padding:.5rem;
      border-radius:6px;
      border:none;
      background:#2a2a2a;
      color:#fff;
      box-sizing:border-box;
    }

    button{
      padding:.6rem .9rem;
      border:none;
      border-radius:8px;
      font-size:1rem;
      cursor:pointer;
      background:#2f64ff;
      color:#fff;
    }

    button.secondary{
      background:#3a3a3a;
    }

    button.start{
      background:#2ecc71;
      color:#0b2015;
      font-weight:600;
    }

    .controls{
      display:flex;
      gap:1rem;
    }

    .controls button{
      flex:1;
    }

    #display{
      text-align:center;
      font-size:6rem;
      margin:2rem 0 1rem;
      font-variant-numeric:tabular-nums;
    }

    #phase{
      text-align:center;
      font-size:1.8rem;
      opacity:.9;
    }

    .hidden{
      display:none;
    }
  </style>
</head>

<body>

<h1>OSCE Timer</h1>

<div class="settings" id="settingsPanel">

  <label>
    Number of Stations
    <input type="number" id="stations" value="10" min="1">
  </label>

  <label>
    Station Length (minutes)
    <input type="number" id="stationLength" value="8" min="1">
  </label>

  <label>
    Warning Time (minutes remaining)
    <input type="number" id="warningTime" value="2" min="0">
  </label>

  <label>
    Reading Time (minutes)
    <input type="number" id="readingTime" value="2" min="0">
  </label>

  <div class="row" style="margin-top:1.5rem;">
    <button type="button" onclick="playEntry()">Test Entry</button>
    <button type="button" onclick="playWarnEnd()">Test Warning</button>
    <button type="button" onclick="playEndStation()">Test End</button>
  </div>

  <div class="row" style="margin-top:1rem;">
    <button onclick="startOSCE()" class="start">
      Start OSCE
    </button>
  </div>

</div>

<div id="phase">Idle</div>
<div id="display">00:00</div>

<div class="controls">
  <button onclick="pauseResume()" class="secondary">Pause</button>
  <button onclick="confirmReset()" class="secondary">Reset</button>
</div>

sounds/entry.wav</audio>
<audio id="warnEndAudio" src="sounds/warningudio>

<script>

let timer;
let remaining = 0;
let station = 0;
let paused = false;
let locked = false;

const display = document.getElementById('display');
const phaseLabel = document.getElementById('phase');
const settingsPanel = document.getElementById('settingsPanel');

const entryAudio = document.getElementById('entryAudio');
const warnEndAudio = document.getElementById('warnEndAudio');
const endStationAudio = document.getElementById('endStationAudio');

function playEntry(){
  entryAudio.currentTime = 0;
  entryAudio.play().catch(console.error);
}

function playWarnEnd(){
  warnEndAudio.currentTime = 0;
  warnEndAudio.play().catch(console.error);
}

function playEndStation(){
  endStationAudio.currentTime = 0;
  endStationAudio.play().catch(console.error);
}

async function startOSCE(){

  try{
    await entryAudio.play();
    entryAudio.pause();
    entryAudio.currentTime = 0;

    await warnEndAudio.play();
    warnEndAudio.pause();
    warnEndAudio.currentTime = 0;

    await endStationAudio.play();
    endStationAudio.pause();
    endStationAudio.currentTime = 0;
  }
  catch(e){
    console.log("Audio initialization skipped", e);
  }

  resetAll();

  locked = true;
  settingsPanel.classList.add('hidden');

  station = 1;
  startReading();
}

function startReading(){

  phaseLabel.textContent =
    `Station ${station}: Reading Time`;

  remaining =
    parseInt(document.getElementById('readingTime').value || '0', 10) * 60;

  runTimer(startStation);
}

function startStation(){

  phaseLabel.textContent =
    `Station ${station}: Enter Room`;

  playEntry();

  setTimeout(() => {

    phaseLabel.textContent =
      `Station ${station}: In Progress`;

    remaining =
      parseInt(document.getElementById('stationLength').value || '0', 10) * 60;

    const warnAt =
      parseInt(document.getElementById('warningTime').value || '0', 10) * 60;

    runTimer(endStation, warnAt);

  }, 2000);
}

function endStation(){

  playEndStation();

  station++;

  if (station >
      parseInt(document.getElementById('stations').value || '0', 10)){

    phaseLabel.textContent = 'OSCE Complete';
    display.textContent = '00:00';
    clearInterval(timer);
    return;
  }

  startReading();
}

function runTimer(onComplete, warningAt){

  clearInterval(timer);

  updateDisplay();

  timer = setInterval(() => {

    if(paused) return;

    remaining--;

    updateDisplay();

    if (warningAt && remaining === warningAt){
      playWarnEnd();
    }

    if (remaining <= 0){
      clearInterval(timer);
      onComplete();
    }

  }, 1000);
}

function updateDisplay(){

  const m = Math.floor(remaining / 60);
  const s = remaining % 60;

  display.textContent =
    `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function pauseResume(){

  if(!locked) return;

  paused = !paused;
}

function confirmReset(){

  if(!locked){
    resetAll();
    return;
  }

  if(confirm('Are you sure you want to reset the OSCE?')){

    resetAll();

    locked = false;

    settingsPanel.classList.remove('hidden');
  }
}

function resetAll(){

  clearInterval(timer);

  station = 0;
  remaining = 0;
  paused = false;

  phaseLabel.textContent = 'Idle';
  display.textContent = '00:00';
}

</script>

</body>
</html>
